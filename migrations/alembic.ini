# alembic.ini — configuração do Alembic para migrations de banco de dados
# Documentação: https://alembic.sqlalchemy.org/en/latest/tutorial.html

[alembic]
# Diretório onde ficam os scripts de migration e env.py
script_location = migrations

# Template usado ao gerar novos arquivos de revision
# %(rev)s = hash da revision, %(slug)s = descrição slugificada
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Trunca slugs longos para evitar nomes de arquivo gigantes
truncate_slug_length = 40

# Fuso horário para os timestamps nos nomes dos arquivos
timezone = UTC

# Sem `sqlalchemy.url`, de propósito (issue #86): a URL vem da DATABASE_URL do
# ambiente (CLI, `make migrate`, deploy) ou de config.attributes["database_url"]
# (chamador in-process). O migrations/env.py RECUSA esta chave — declarada aqui,
# ela venceria o ambiente e migraria um banco que ninguém escolheu.

[post_write_hooks]
# Formata automaticamente os arquivos de migration gerados com ruff
hooks = ruff
ruff.type = exec
ruff.entrypoint = ruff
ruff.options = format REVISION_SCRIPT_FILENAME

# ---------------------------------------------------------------------------
# Configuração de logging do Alembic
# ---------------------------------------------------------------------------
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
