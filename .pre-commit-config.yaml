# Hooks mínimos que espelham `make check` (ruff, mypy e import-linter) e validam
# a mensagem de commit contra docs/CONVENTIONS.md §4 e docs/GIT-WORKFLOW.md.
#
# Instalação (uma vez por clone, no checkout principal — automatizada em `make setup`):
#     uv run python scripts/install_hooks.py
# Os hooks valem para todas as worktrees; nunca rode `pre-commit install` dentro de
# uma (docs/GIT-WORKFLOW.md §"Hooks do git", issue #100).
#
# Nenhum hook traz a própria versão da ferramenta (issue #7). Todos são `local` e
# chamam a ferramenta pelo `uv run`: o mesmo binário, na versão do `uv.lock`, que
# os targets do Makefile usam. Um repositório remoto pinado por `rev`
# (ruff-pre-commit, mirrors-mypy) é uma segunda fonte de versão, que se afasta da
# do lock sem aviso: o ruff do hook aprovou o que o `make lint` rejeitava (Stage
# 1.1), e o mypy do hook, num ambiente isolado sem PyJWT nem argon2, reprovou o
# que o `make typecheck` aprovava (Stage 2.4). O
# `tests/unit/test_precommit_config.py` reprova a volta de um `rev` ou de
# `additional_dependencies` e cobra que cada hook rode o comando do seu target.

repos:
  - repo: local
    hooks:
      # Formata os arquivos do commit. A contrapartida no `make check` é o
      # `make fmt-check`, que confere sem formatar (issue #99,
      # docs/runbooks/validate-ci-gate.md §Class 2).
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format --force-exclude
        language: system
        types_or: [python, pyi, jupyter]
        require_serial: true

      # O `make lint` sobre os arquivos do commit, corrigindo o que for seguro.
      - id: ruff
        name: ruff check
        entry: uv run ruff check --force-exclude --fix
        language: system
        types_or: [python, pyi, jupyter]
        require_serial: true

      # Exatamente o `make typecheck`: o programa inteiro, não os arquivos do
      # commit (`pass_filenames: false`). Com a lista de arquivos, o mypy não
      # olha para quem importa o que mudou — trocar a assinatura de um port
      # passava no hook e quebrava os implementadores e chamadores em outros
      # arquivos. Dispara quando muda o que decide o veredito: o código checado,
      # a configuração (`[tool.mypy]` do pyproject) e o lock (versão do mypy e
      # dos pacotes tipados).
      - id: mypy
        name: mypy (make typecheck)
        entry: uv run mypy src/ tests/fakes/
        language: system
        pass_filenames: false
        files: ^(src/|tests/fakes/|pyproject\.toml$|uv\.lock$)

  - repo: local
    hooks:
      - id: check-commit-msg
        name: check-commit-msg (Conventional Commits + reserved gates)
        entry: python scripts/check_commit_msg.py
        language: system
        stages: [commit-msg]
        # Validates the subject of the commit message file passed by git.
        # Rules: docs/CONVENTIONS.md §4(a)/§4(b), docs/GIT-WORKFLOW.md §Commits.

      - id: lint-imports
        name: lint-imports (import-linter contracts — LAYOUT §3)
        # `language: system` executa no PATH do shell (sem venv ativado),
        # então o entry precisa do `uv run` para resolver o console script.
        entry: uv run lint-imports
        language: system
        pass_filenames: false
        files: \.(py|importlinter)$
