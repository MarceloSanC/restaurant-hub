# Hooks mínimos que espelham `make check` (ruff + mypy) e validam a
# mensagem de commit contra docs/CONVENTIONS.md §4 e docs/GIT-WORKFLOW.md.
#
# Instalação (uma vez por clone — automatizada em `make setup`):
#     uv run pre-commit install --install-hooks --hook-type pre-commit --hook-type commit-msg

repos:
  # rev alinhado à versão que o uv resolve para a dep `ruff` do projeto —
  # drift entre os dois faz hook e `make lint` divergirem (finding da 1.1).
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.21
    hooks:
      - id: ruff-format
      - id: ruff
        args: [--fix]

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.11.2
    hooks:
      - id: mypy
        files: ^src/
        args: [--strict]
        additional_dependencies:
          - fastapi>=0.111
          - uvicorn[standard]>=0.29
          - sqlalchemy>=2.0
          - alembic>=1.13
          - pydantic>=2.7
          - pydantic-settings>=2.3

  - repo: local
    hooks:
      - id: check-commit-msg
        name: check-commit-msg (Conventional Commits + reserved gates)
        entry: python scripts/check_commit_msg.py
        language: system
        stages: [commit-msg]
        # Validates the subject of the commit message file passed by git.
        # Rules: docs/CONVENTIONS.md §4(a)/§4(b), docs/GIT-WORKFLOW.md §Commits.

      - id: lint-imports
        name: lint-imports (import-linter contracts — LAYOUT §3)
        # `language: system` executa no PATH do shell (sem venv ativado),
        # então o entry precisa do `uv run` para resolver o console script.
        entry: uv run lint-imports
        language: system
        pass_filenames: false
        files: \.(py|importlinter)$
