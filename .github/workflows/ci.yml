name: ci

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  # Gate de origem de PRs para main:
  # Como GitHub Free não dá branch protection em repos privados, replicamos a
  # restrição "PRs para main só vêm de develop ou hotfix/*" como required check
  # no CI. Configure este job como Required Status Check em main quando o repo
  # estiver no plano que suportar — ou aceite como gate apenas observacional
  # no Free.
  guard-main-source:
    if: github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Bloquear se origem não for develop ou hotfix/*
        run: |
          head="${{ github.event.pull_request.head.ref }}"
          if [[ "$head" == "develop" || "$head" == hotfix/* ]]; then
            echo "OK: PR para main vindo de '$head'"
          else
            echo "PRs para main só são aceitos de 'develop' ou 'hotfix/*'. Origem: $head" >&2
            exit 1
          fi

  lint-and-test:
    runs-on: ubuntu-latest

    # Postgres real no gate (Stage 2.3, ADR 2.3.0001).
    #
    # A partir da Stage 2.3 o `make check` roda testes de integração que exigem
    # banco, e eles NÃO se pulam quando o banco falta — falham alto. Sem este
    # service as alternativas seriam CI permanentemente vermelho ou testes que se
    # auto-pulam, e a segunda é o falso-verde que a Stage 1.2 catalogou: "verde
    # por não ter olhado". Aqui não existe caminho de skip, então não há o que
    # degradar em silêncio.
    #
    # `tests/unit/test_ci_workflow.py` assere a presença deste bloco e da
    # DATABASE_URL abaixo: removê-los reprova `make check` localmente, em vez de
    # só aparecer num run vermelho depois do push.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: pass
          POSTGRES_DB: restaurant_hub
        ports:
          - 5432:5432
        # O runner espera o health check antes dos steps — sem isto o job corre
        # contra um banco ainda subindo, e a falha é intermitente (a pior espécie
        # num gate).
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # Política de CI viaja por `env:`, NUNCA por argumento na linha de comando —
    # invariante I3 da Stage 1.2. O step abaixo roda literalmente `make check`, e
    # é isso que sustenta o argumento de transitividade do
    # docs/runbooks/validate-ci-gate.md ("o que reprova localmente reprova no
    # runner"). Um argumento extra aqui quebraria esse argumento em silêncio.
    env:
      DATABASE_URL: postgresql+psycopg://user:pass@localhost:5432/restaurant_hub

    steps:
      # fetch-depth: 0 é REQUISITO do gate, não otimização.
      # `make check` → `docs-check` → `check_technical_postexec.py` checagem 2
      # (freeze da §7, CONVENTIONS §3.4) localiza o commit-baseline
      # `stage N.M: technical approved` via `git log`, e resolve `origin/develop`
      # para saber se a Stage já mergeou. Com o clone raso default
      # (fetch-depth: 1) nada disso existe no runner: a checagem devolve None e
      # se PULA EM SILÊNCIO — verde por não ter olhado, exatamente na janela que
      # ela protege (Stage `done` e ainda não mergeada = todo PR de Stage).
      # Ver ADR 1.2.0001 (docs/adr/1_2_0001-deterministic-pr-path-gates.md).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: uv sync --extra dev

      # O nome espelha a cadeia real do target `check` (Makefile). Se a cadeia
      # mudar lá, atualize aqui — e em docs/runbooks/validate-ci-gate.md, que
      # cita este nome verbatim.
      - name: Run gate completo (lint + fmt-check + typecheck + layout-check + import-check + lock-check + docs-check + test-gate)
        run: make check
