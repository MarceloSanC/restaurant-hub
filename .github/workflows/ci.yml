name: ci

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  # Gate de origem de PRs para main:
  # Como GitHub Free não dá branch protection em repos privados, replicamos a
  # restrição "PRs para main só vêm de develop ou hotfix/*" como required check
  # no CI. Configure este job como Required Status Check em main quando o repo
  # estiver no plano que suportar — ou aceite como gate apenas observacional
  # no Free.
  guard-main-source:
    if: github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Bloquear se origem não for develop ou hotfix/*
        run: |
          head="${{ github.event.pull_request.head.ref }}"
          if [[ "$head" == "develop" || "$head" == hotfix/* ]]; then
            echo "OK: PR para main vindo de '$head'"
          else
            echo "PRs para main só são aceitos de 'develop' ou 'hotfix/*'. Origem: $head" >&2
            exit 1
          fi

  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 é REQUISITO do gate, não otimização.
      # `make check` → `docs-check` → `check_technical_postexec.py` checagem 2
      # (freeze da §7, CONVENTIONS §3.4) localiza o commit-baseline
      # `stage N.M: technical approved` via `git log`, e resolve `origin/develop`
      # para saber se a Stage já mergeou. Com o clone raso default
      # (fetch-depth: 1) nada disso existe no runner: a checagem devolve None e
      # se PULA EM SILÊNCIO — verde por não ter olhado, exatamente na janela que
      # ela protege (Stage `done` e ainda não mergeada = todo PR de Stage).
      # Ver ADR 1.2.0001 (docs/adr/1_2_0001-deterministic-pr-path-gates.md).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run gate completo (lint + typecheck + layout-check + tests)
        run: make check
