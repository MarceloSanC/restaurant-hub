[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "restaurant-hub"
version = "0.1.0"
description = "Backend multi-tenant em FastAPI e arquitetura hexagonal com vertical slices, sobre PostgreSQL/SQLAlchemy 2/Alembic. Primeiro módulo: escala de funcionários."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Marcelo" }]
dependencies = [
    # Framework HTTP
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    # ORM e banco de dados
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    # Driver PostgreSQL (DBAPI). Sem ele o SQLAlchemy não abre conexão nenhuma —
    # o projeto declarava o ORM e driver algum até a Stage 2.3. psycopg 3 (e não
    # psycopg2, em manutenção) pela linha atual e pelo caminho para async, caso a
    # 2.4+ precise. A URL usa o esquema explícito `postgresql+psycopg://` para
    # não depender do driver default do SQLAlchemy, que é justamente o psycopg2.
    "psycopg[binary]>=3.2",
    # Validação e configuração
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    # Segurança (Stage 2.4 — ADR 2.4.0004)
    #
    # argon2-cffi: binding de referência para a implementação C do argon2, com
    # argon2id como default. É a primeira recomendação do OWASP Password Storage
    # Cheat Sheet. Preterido `passlib` (sem release desde 2020) — o port
    # `PasswordHasher` já é a camada de abstração, e uma segunda seria um
    # invólucro não mantido em volta do que se quer usar direto.
    "argon2-cffi>=23.1",
    # PyJWT: codec JWT padrão de facto e ativamente mantido. Preteridos
    # `python-jose` (CVEs acumuladas, manutenção esparsa) e `authlib`
    # (framework OAuth inteiro onde só se precisa de um codec).
    "pyjwt>=2.9",
]

[project.optional-dependencies]
dev = [
    # Testes
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    # Qualidade de código
    "ruff>=0.6",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "import-linter>=2.0",
    # Parsing de workflow do GitHub Actions no teste de invariante de CI
    # (tests/unit/test_ci_workflow.py). Vinha só como dep transitiva do
    # pre-commit; declarada aqui porque teste-gate não pode depender de carona:
    # se a carona sair, o gate morre em silêncio — que é o defeito que a
    # Stage 1.2 existe para consertar.
    "pyyaml>=6.0",
]

[tool.hatch.build.targets.wheel]
# Apenas o pacote src/restaurant_hub é empacotado; scripts/ e tests/ ficam fora
packages = ["src/restaurant_hub"]

# ---------------------------------------------------------------------------
# Ruff — linter e formatter
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear — pega armadilhas comuns
    "UP",  # pyupgrade — moderniza sintaxe
    "SIM", # flake8-simplify — simplifica expressões
    "RUF", # regras específicas do Ruff
    "ANN", # flake8-annotations — força type hints
    "PL",  # pylint (subconjunto portado)
    "TID", # flake8-tidy-imports — proíbe imports relativos implícitos
]
[tool.ruff.lint.isort]
# Garante que imports do pacote local aparecem após libs de terceiros
known-first-party = ["restaurant_hub"]

# ---------------------------------------------------------------------------
# Mypy — checagem estática de tipos
# ---------------------------------------------------------------------------
[tool.mypy]
files = ["src"]
strict = true
# Permite importar libs sem stubs sem gerar erro
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "unit: testes unitários — sem I/O, sem banco, sem rede",
    "integration: testes de integração — usam banco ou serviços reais",
    "contract: testes de contrato — validam que fakes e reais respeitam o mesmo contrato",
    "e2e: testes de ponta a ponta — sobem a aplicação completa",
    "slow: testes lentos — pulados em CI rápido com -m 'not slow'",
]

[tool.coverage.run]
source = ["src"]
omit = ["*/migrations/*", "*/scripts/*"]
# Cobertura de branch, não só de linha (Stage 2.2). Sem isso, uma condição
# composta conta como coberta assim que a linha executa uma vez — e é justamente
# em guarda de autorização (`authorize_action` tem 20 branches) que o ramo não
# exercitado é o buraco de segurança. Verificado ao ativar: a camada application
# permanece 100%, então nada foi afrouxado para o gate caber.
branch = true

[tool.coverage.report]
# Gate de cobertura — falha o pytest se < 90%. Vale para qualquer invocação
# de pytest --cov (test-cov, CI). Alinha com CLAUDE.md, README e GIT-WORKFLOW.
fail_under = 90
show_missing = true
skip_covered = false
