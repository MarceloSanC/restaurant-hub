[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "restaurant-hub"
version = "0.1.0"
description = "Backend multi-tenant em FastAPI e arquitetura hexagonal com vertical slices, sobre PostgreSQL/SQLAlchemy 2/Alembic. Primeiro módulo: escala de funcionários."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Marcelo" }]
dependencies = [
    # Framework HTTP
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    # ORM e banco de dados
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    # Driver PostgreSQL (DBAPI). Sem ele o SQLAlchemy não abre conexão nenhuma —
    # o projeto declarava o ORM e driver algum até a Stage 2.3. psycopg 3 (e não
    # psycopg2, em manutenção) pela linha atual e pelo caminho para async, caso a
    # 2.4+ precise. A URL usa o esquema explícito `postgresql+psycopg://` para
    # não depender do driver default do SQLAlchemy, que é justamente o psycopg2.
    "psycopg[binary]>=3.2",
    # Validação e configuração
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    # Segurança (Stage 2.4 — ADR 2.4.0004)
    #
    # argon2-cffi: binding de referência para a implementação C do argon2, com
    # argon2id como default. É a primeira recomendação do OWASP Password Storage
    # Cheat Sheet. Preterido `passlib` (sem release desde 2020) — o port
    # `PasswordHasher` já é a camada de abstração, e uma segunda seria um
    # invólucro não mantido em volta do que se quer usar direto.
    "argon2-cffi>=23.1",
    # PyJWT: codec JWT padrão de facto e ativamente mantido. Preteridos
    # `python-jose` (CVEs acumuladas, manutenção esparsa) e `authlib`
    # (framework OAuth inteiro onde só se precisa de um codec).
    "pyjwt>=2.9",
]

[project.optional-dependencies]
dev = [
    # Testes
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    # Qualidade de código
    "ruff>=0.6",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "import-linter>=2.0",
    # Parsing de workflow do GitHub Actions no teste de invariante de CI
    # (tests/unit/test_ci_workflow.py). Vinha só como dep transitiva do
    # pre-commit; declarada aqui porque teste-gate não pode depender de carona:
    # se a carona sair, o gate morre em silêncio — que é o defeito que a
    # Stage 1.2 existe para consertar.
    "pyyaml>=6.0",
]
# Extra SEPARADA do `dev` de propósito (M2 da issue #45). Uma corrida de
# mutação gera um processo pytest por mutante — centenas deles —, e esse volume
# é problema conhecido nesta máquina. Fora do `dev`, ninguém a instala sem
# querer, `make check` não a alcança, e o pre-commit tampouco: quem a usa é o
# job noturno do `audit-gate.yml`, que roda no runner.
#
# mutmut 3.x **não roda em Windows nativo** (ele mesmo recusa e aponta para o
# WSL). No host, a corrida é feita em contêiner Linux; no CI, é nativa.
mutation = [
    "mutmut>=3.0",
]

[tool.hatch.build.targets.wheel]
# Apenas o pacote src/restaurant_hub é empacotado; scripts/ e tests/ ficam fora
packages = ["src/restaurant_hub"]

# ---------------------------------------------------------------------------
# Ruff — linter e formatter
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear — pega armadilhas comuns
    "UP",  # pyupgrade — moderniza sintaxe
    "SIM", # flake8-simplify — simplifica expressões
    "RUF", # regras específicas do Ruff
    "ANN", # flake8-annotations — força type hints
    "PL",  # pylint (subconjunto portado)
    "TID", # flake8-tidy-imports — proíbe imports relativos implícitos
]
# `›` e `–` são gramática, não confusão: o `›` separa seção de rótulo na âncora de
# citação ao roadmap e o `–` é o travessão de faixa dos docs em PT (issue #79,
# `scripts/check_roadmap_citations.py`).
allowed-confusables = ["›", "–"]
[tool.ruff.lint.isort]
# Garante que imports do pacote local aparecem após libs de terceiros
known-first-party = ["restaurant_hub"]

# ---------------------------------------------------------------------------
# Mypy — checagem estática de tipos
# ---------------------------------------------------------------------------
[tool.mypy]
files = ["src"]
strict = true
# Permite importar libs sem stubs sem gerar erro
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "unit: testes unitários — sem I/O, sem banco, sem rede",
    "integration: testes de integração — usam banco ou serviços reais",
    "contract: testes de contrato — validam que fakes e reais respeitam o mesmo contrato",
    "e2e: testes de ponta a ponta — sobem a aplicação completa",
    "slow: testes lentos — pulados em CI rápido com -m 'not slow'",
]

[tool.coverage.run]
# `scripts/` e `.claude/hooks/` entram desde a issue #91: são os gates e os hooks
# que decidem se o código entra. O `make test-gate` os relata à parte do `src/`.
source = ["src", "scripts", ".claude/hooks"]
omit = ["*/migrations/*"]
# Cobertura de branch, não só de linha (Stage 2.2). Sem isso, uma condição
# composta conta como coberta assim que a linha executa uma vez — e é justamente
# em guarda de autorização (`authorize_action` tem 20 branches) que o ramo não
# exercitado é o buraco de segurança. Verificado ao ativar: a camada application
# permanece 100%, então nada foi afrouxado para o gate caber.
branch = true

[tool.coverage.report]
# Gate de cobertura — falha o pytest se < 90%. Vale para qualquer invocação
# de pytest --cov (test-cov, CI). Alinha com CLAUDE.md, README e GIT-WORKFLOW.
fail_under = 90
show_missing = true
skip_covered = false
# O bloco `if __name__ == "__main__":` dos scripts (e do `main.py`) só chama o
# `main()`, que os testes exercitam in-process; o bloco em si só roda por
# subprocess, que o coverage não mede (issue #91).
exclude_also = ['if __name__ == "__main__":']

# ---------------------------------------------------------------------------
# Mutmut — teste de mutação nos módulos que DECIDEM ACESSO (M2 da issue #45)
# ---------------------------------------------------------------------------
# Escopado em quatro arquivos, e não no repositório. O critério de entrada é
# único e estreito: **o módulo participa da decisão de quem pode o quê**.
#
#   - `authorize_action.py`  — os quatro passos do guard (ADR 2.2.0002)
#   - `user.py`              — a visibilidade de unidade, o eixo B do acesso
#   - `local_access_guard.py` — o `AccessGuard` de staff, que resolve o tenant
#                              omitido e impõe a lei L-AG3 (isolamento de
#                              tenant) num `raise`. Até a issue #47 a mesma
#                              lógica era o `_IdentityAccessGuard`, e o arquivo
#                              mutado era o `composition_root.py`
#   - `dependencies.py`      — a borda que extrai o Bearer e delega ao use case
#
# **Por que mutação aqui e cobertura em todo o resto.** Cobertura mede que a
# linha executou; mutação mede que alguém teria notado se ela mudasse. Nesses
# quatro arquivos a diferença é a que importa: `if not actor_tenant_id` virando
# `if actor_tenant_id is None` mantém 100% de cobertura, passa mypy strict e
# reabre o balde de tenant vazio. Um caso desses já foi medido sobrevivendo à
# suíte (ver `test_local_access_guard.py`, comentário de `_ALVOS`) — a
# mutação não é hipótese aqui, é histórico.
#
# **`also_copy` é o que faz a corrida medir alguma coisa.** O mutmut executa a
# suíte a partir de uma cópia da árvore em `mutants/`, e copia por default só o
# código, `tests/` e os arquivos de projeto (`pyproject.toml`, `uv.lock` —
# `configuration.py` do mutmut 3.7). Esta suíte, porém, lê o **repositório** de
# dentro dos testes — é o idioma mecânico deste projeto: `test_ci_workflow.py` lê
# `.github/workflows/ci.yml`, `test_bc_independence.py` lê `.importlinter`, os
# testes de contrato de staff leem `docs/stages/…/concept.md`, os gates da #45
# leem `scripts/` e `docs/LAYOUT.md`, e o `test_precommit_config.py` (issue #7)
# lê o `.pre-commit-config.yaml` e o `Makefile`.
#
# Sem esses arquivos, o primeiro teste que os procura levanta `FileNotFoundError`
# e a corrida morre antes de matar um mutante sequer — medido na primeira
# execução desta configuração. E o modo de falha silencioso seria pior: com um
# teste que falhasse por arquivo ausente **sem** derrubar a corrida, todo mutante
# apareceria como morto, pelo mesmo motivo, e a mutação reportaria uma suíte
# perfeita sem ter testado nada.
[tool.mutmut]
source_paths = ["src/restaurant_hub"]
only_mutate = [
    "src/restaurant_hub/features/identity/application/use_cases/authorize_action.py",
    "src/restaurant_hub/features/identity/domain/entities/user.py",
    "src/restaurant_hub/features/staff/adapters/out/identity/local_access_guard.py",
    "src/restaurant_hub/features/identity/adapters/inbound/http/dependencies.py",
    "src/restaurant_hub/features/identity/application/ports/out/action_authorizer.py",
]
also_copy = [
    "docs/",
    "migrations/",
    "scripts/",
    ".github/",
    ".importlinter",
    ".env.example",
    # `test_database_url_guard.py` cobra o default de porta do compose contra o
    # arquivo (issue #58).
    "docker-compose.yml",
    ".pre-commit-config.yaml",
    "Makefile",
    # `test_git_guard.py` e `test_triage_gate.py` carregam os hooks na coleta, e
    # `scripts/check_harness.py` lê skills, agents e o settings (issue #87). As
    # quatro entradas rastreadas, e não `.claude/` inteiro: o checkout principal
    # guarda as worktrees em `.claude/worktrees/` (não rastreado), e a corrida no
    # contêiner copiaria cada uma, `.venv` incluso, para dentro de `mutants/`.
    # O arquivo vem depois dos diretórios: o mutmut copia com `shutil.copy2`, que
    # não cria `mutants/.claude/` — quem cria é o `copytree` de `hooks/`.
    ".claude/hooks/",
    ".claude/skills/",
    ".claude/agents/",
    ".claude/settings.json",
    # Citados num `.py` rastreado sem serem lidos por `parents[2]`: o
    # `test_eol_policy.py` lê o `.gitattributes` pela raiz do git, e os dois `.md`
    # são casos de tabela. A guarda de `tests/unit/test_mutation_scope.py` cobra
    # todo literal que nomeia arquivo rastreado — aproximação por excesso: a
    # entrada a mais custa nada, a que falta derruba a corrida (issue #87).
    ".gitattributes",
    "CLAUDE.md",
    "README.md",
]
# `test_check_layout.py` fica de fora da corrida, e o motivo é estrutural, não
# conveniência.
#
# O mutmut reescreve cada função mutada trocando-a por um despachante mais **uma
# cópia por mutante** (sufixos `__mutmut_1`, `__mutmut_2`, …). Dentro de
# `mutants/`, `AuthorizedActor` aparece construído uma vez por cópia de
# `authorize_action`, e o Gate 8 (um sítio de construção por result) reprova —
# corretamente, sobre um arquivo que a **ferramenta** escreveu. Até a issue #47 o
# Gate 1 reprovava também, pelo `composition_root.py` mutado; ele saiu do escopo
# com o tradutor, e o Gate 8 basta para manter a exclusão.
#
# Excluí-lo não enfraquece nada, e é a única leitura correta da pergunta que a
# mutação faz. Ele é um gate **estrutural sobre o texto do fonte**: mudar um
# `>=` para `>` dentro de `authorize_action` não altera se o charter vale, então
# ele não teria como matar mutante nenhum. Mantê-lo faria toda a corrida morrer
# na coleta de estatísticas — que foi o que aconteceu, medido — sem chegar a
# executar um mutante sequer.
#
# Os demais gates da #45 continuam na corrida: `check_dead_shared` e
# `test_status_map` leem arquivos que o mutmut não toca.
pytest_add_cli_args_test_selection = [
    "--ignore=tests/unit/test_check_layout.py",
]
